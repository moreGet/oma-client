services:
  neo4j:
    image: neo4j:community
    container_name: neo4j-ontology
    restart: always
    ports:
      - "7474:7474"   # HTTP (Browser UI)
      - "17687:7687"  # Bolt 프로토콜 (애플리케이션 접속용)
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./import:/var/lib/neo4j/import
      - ./plugins:/plugins
    environment:
      # 1. 인증 설정 (비밀번호를 원하는 값으로 변경하세요)
      - NEO4J_AUTH=neo4j/your_password_here
      
      # 2. 플러그인 설치 (리스트 전체를 따옴표로 감싸는 것이 안전합니다)
      - NEO4J_PLUGINS='["apoc", "graph-data-science"]'
      
      # 3. 보안 설정 (Neo4j 5.x에서도 dbms prefix가 안정적으로 작동합니다)
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      
      # 4. 메모리 설정 (핵심: 설정명에 포함된 언더바는 '__'로 표기)
      # server.memory.heap.initial_size -> NEO4J_server_memory_heap_initial__size
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache__size=1G

    # Rocky 8/Linux 환경에서 볼륨 권한 문제를 해결하기 위한 설정
    # 실행 전 터미널에서 export UID=$(id -u) 및 export GID=$(id -g)를 하거나
    # .env 파일에 해당 값을 적어주어야 합니다.
    user: "${UID}:${GID}"